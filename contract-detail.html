<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Contract — Provaspace</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4169E1">
    <link rel="icon" href="icons/icon-192.svg" type="image/svg+xml">

<style>
:root {
    --bg-main: #f4f6fd;
    --bg-card: #ffffff;
    --border-color: rgba(65,105,225,0.13);
    --text-primary: #16213e;
    --text-secondary: #64748b;
    --accent-blue: #4169E1;
    --accent-gradient: linear-gradient(135deg,#4169E1 0%,#5b82f0 100%);
    --accent-green: #10b981;
    --accent-amber: #f59e0b;
    --accent-red: #ef4444;
    --radius-lg: 18px;
    --radius-md: 12px;
    --sidebar-w: 360px;
    --topbar-h: 64px;
    --input-h: 72px;
    --shadow-sm: 0 1px 4px rgba(0,0,0,0.06);
    --shadow-md: 0 4px 16px rgba(0,0,0,0.08);
}

*{box-sizing:border-box;margin:0;padding:0;font-family:'Plus Jakarta Sans',sans-serif;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg-main);color:var(--text-primary);}

/* ── LAYOUT ── */
.workspace{display:flex;width:100vw;height:100vh;position:relative;overflow:hidden;}

/* watermark */
.workspace::before{
    content:"\f3ed";font-family:"Font Awesome 6 Free";font-weight:900;
    position:absolute;top:50%;left:60%;transform:translate(-50%,-50%);
    font-size:28rem;color:rgba(65,105,225,0.022);pointer-events:none;z-index:0;
}
.workspace::after{
    content:"SECURED WORKSPACE";position:absolute;top:57%;left:60%;
    transform:translate(-50%,-50%);font-size:1.1rem;font-weight:800;
    letter-spacing:8px;color:rgba(65,105,225,0.032);pointer-events:none;z-index:0;
}

/* ── SIDEBAR ── */
.sidebar{
    width:var(--sidebar-w);min-width:var(--sidebar-w);height:100%;
    background:rgba(255,255,255,0.96);backdrop-filter:blur(16px);
    border-right:1px solid var(--border-color);display:flex;flex-direction:column;
    z-index:20;box-shadow:4px 0 28px rgba(0,0,0,0.03);overflow:hidden;
    transition:transform .3s cubic-bezier(.4,0,.2,1);
}

.sidebar-inner{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px;}
.sidebar-inner::-webkit-scrollbar{width:4px;}
.sidebar-inner::-webkit-scrollbar-track{background:transparent;}
.sidebar-inner::-webkit-scrollbar-thumb{background:var(--border-color);border-radius:4px;}

.sidebar-header{display:flex;align-items:center;gap:10px;padding:18px 20px 0;}
.back-btn{
    width:36px;height:36px;border-radius:50%;background:var(--bg-main);
    border:1px solid var(--border-color);display:flex;align-items:center;
    justify-content:center;color:var(--text-primary);text-decoration:none;
    flex-shrink:0;transition:all .2s;
}
.back-btn:hover{background:var(--accent-blue);color:#fff;border-color:var(--accent-blue);}
.contract-title-text{font-size:1rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* ── PANEL ── */
.panel{
    background:var(--bg-card);border:1px solid var(--border-color);
    border-radius:var(--radius-lg);padding:16px;display:flex;flex-direction:column;gap:10px;
    box-shadow:var(--shadow-sm);
}
.panel-label{
    font-size:0.7rem;font-weight:800;letter-spacing:.8px;text-transform:uppercase;
    color:var(--accent-blue);display:flex;align-items:center;gap:6px;
}
.status-line{font-size:0.8rem;color:var(--text-secondary);font-weight:500;line-height:1.6;}

/* ── MILESTONES ── */
.milestone-item{
    display:flex;justify-content:space-between;align-items:center;
    background:var(--bg-main);border:1px solid var(--border-color);
    border-radius:var(--radius-md);padding:10px 12px;gap:8px;
    transition:border-color .2s;
}
.milestone-item.done{border-color:rgba(16,185,129,.35);background:rgba(16,185,129,.03);}
.milestone-item.requested{border-color:rgba(245,158,11,.35);background:rgba(245,158,11,.03);}
.m-name{font-weight:700;font-size:0.82rem;}
.m-sub{font-size:0.72rem;color:var(--text-secondary);margin-top:2px;}

/* ── BADGES ── */
.badge{display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border-radius:999px;font-size:0.7rem;font-weight:700;}
.badge-green{background:rgba(16,185,129,.12);color:#059669;}
.badge-amber{background:rgba(245,158,11,.12);color:#d97706;}
.badge-red{background:rgba(239,68,68,.12);color:#dc2626;}
.badge-blue{background:rgba(65,105,225,.12);color:var(--accent-blue);}

/* ── MINI BUTTONS ── */
.mini-btn{
    padding:7px 13px;border-radius:9px;font-size:0.75rem;font-weight:700;
    border:none;cursor:pointer;transition:all .15s;white-space:nowrap;
    background:var(--accent-gradient);color:#fff;
    box-shadow:0 2px 6px rgba(65,105,225,.2);
}
.mini-btn:hover{opacity:.9;transform:translateY(-1px);}
.mini-btn:active{transform:scale(.97);}
.mini-btn.outline{background:transparent;border:1.5px solid var(--border-color);color:var(--text-secondary);box-shadow:none;}
.mini-btn.outline:hover{border-color:var(--accent-blue);color:var(--accent-blue);}
.mini-btn.danger{background:rgba(239,68,68,.1);color:var(--accent-red);box-shadow:none;}
.mini-btn.danger:hover{background:rgba(239,68,68,.18);}

/* ── ACTIONS ROW ── */
.actions-row{display:flex;gap:8px;flex-wrap:wrap;}

/* ── CHAT MAIN ── */
.chat-area{flex:1;display:flex;flex-direction:column;height:100%;min-width:0;position:relative;z-index:1;}

/* chat topbar */
.chat-topbar{
    height:var(--topbar-h);padding:0 24px;
    background:rgba(255,255,255,.9);backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border-color);
    display:flex;align-items:center;justify-content:space-between;
    flex-shrink:0;box-shadow:var(--shadow-sm);
}
.chat-peer{display:flex;align-items:center;gap:12px;}
.peer-avatar{
    width:40px;height:40px;border-radius:50%;
    background:var(--accent-gradient);color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:0.95rem;flex-shrink:0;
}
.peer-name{font-size:0.95rem;font-weight:700;}
.peer-status{font-size:0.72rem;color:var(--accent-green);font-weight:600;display:flex;align-items:center;gap:4px;}
.peer-status::before{content:'';width:6px;height:6px;background:var(--accent-green);border-radius:50%;display:inline-block;}

.hamburger{
    display:none;width:38px;height:38px;border-radius:10px;
    border:1px solid var(--border-color);background:var(--bg-main);
    align-items:center;justify-content:center;cursor:pointer;
    color:var(--text-primary);font-size:1rem;flex-shrink:0;transition:all .2s;
}
.hamburger:hover{background:var(--accent-blue);color:#fff;border-color:var(--accent-blue);}

/* chat messages */
.chat-messages{
    flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:12px;
    scroll-behavior:smooth;
}
.chat-messages::-webkit-scrollbar{width:4px;}
.chat-messages::-webkit-scrollbar-track{background:transparent;}
.chat-messages::-webkit-scrollbar-thumb{background:var(--border-color);border-radius:4px;}

.bubble-wrap{display:flex;flex-direction:column;gap:3px;max-width:68%;}
.bubble-wrap.mine{align-self:flex-end;align-items:flex-end;}
.bubble-wrap.theirs{align-self:flex-start;align-items:flex-start;}

.bubble{
    padding:12px 16px;border-radius:16px;font-size:0.88rem;line-height:1.55;
    word-break:break-word;position:relative;
}
.bubble.mine{
    background:var(--accent-gradient);color:#fff;
    border-bottom-right-radius:4px;
    box-shadow:0 2px 8px rgba(65,105,225,.25);
}
.bubble.theirs{
    background:var(--bg-card);border:1px solid var(--border-color);
    color:var(--text-primary);border-bottom-left-radius:4px;
    box-shadow:var(--shadow-sm);
}
.bubble-time{font-size:0.65rem;color:var(--text-secondary);padding:0 4px;}

/* file bubbles */
.file-bubble{
    display:flex;align-items:center;gap:10px;padding:10px 14px;
    border-radius:var(--radius-md);min-width:180px;
}
.file-bubble.mine{background:rgba(255,255,255,.18);}
.file-bubble.theirs{background:var(--bg-main);border:1px solid var(--border-color);}
.file-icon{width:36px;height:36px;border-radius:8px;background:rgba(65,105,225,.1);
    display:flex;align-items:center;justify-content:center;color:var(--accent-blue);font-size:1rem;flex-shrink:0;}
.file-name{font-size:0.78rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px;}
.file-size{font-size:0.68rem;color:var(--text-secondary);}

/* image in chat */
.chat-img{
    max-width:240px;max-height:220px;border-radius:var(--radius-md);
    display:block;cursor:pointer;object-fit:cover;
    transition:opacity .2s;
}
.chat-img:hover{opacity:.9;}

/* empty / typing */
.empty-chat{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:var(--text-secondary);gap:12px;
}
.empty-chat i{font-size:2.5rem;opacity:.3;}
.empty-chat p{font-size:0.85rem;}

.typing-indicator{display:flex;align-items:center;gap:4px;padding:8px 14px;}
.dot{width:7px;height:7px;border-radius:50%;background:var(--text-secondary);opacity:.4;animation:blink 1.2s infinite;}
.dot:nth-child(2){animation-delay:.2s;}
.dot:nth-child(3){animation-delay:.4s;}
@keyframes blink{0%,80%,100%{opacity:.4;}40%{opacity:1;}}

/* date divider */
.date-divider{
    display:flex;align-items:center;gap:10px;margin:6px 0;
}
.date-divider::before,.date-divider::after{content:'';flex:1;height:1px;background:var(--border-color);}
.date-divider span{font-size:0.68rem;font-weight:700;color:var(--text-secondary);white-space:nowrap;}

/* ── INPUT BAR ── */
.input-bar{
    padding:14px 20px;background:rgba(255,255,255,.92);
    backdrop-filter:blur(12px);border-top:1px solid var(--border-color);flex-shrink:0;
}
.input-bar.uploading{opacity:.7;pointer-events:none;}

/* upload preview */
.upload-preview{
    display:none;align-items:center;gap:10px;padding:8px 12px;
    background:var(--bg-main);border:1px solid var(--border-color);
    border-radius:var(--radius-md);margin-bottom:10px;
}
.upload-preview.visible{display:flex;}
.preview-thumb{width:40px;height:40px;border-radius:8px;object-fit:cover;flex-shrink:0;}
.preview-file-icon{width:40px;height:40px;border-radius:8px;background:rgba(65,105,225,.08);
    display:flex;align-items:center;justify-content:center;color:var(--accent-blue);font-size:1.1rem;flex-shrink:0;}
.preview-info{flex:1;min-width:0;}
.preview-name{font-size:0.78rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.preview-size{font-size:0.68rem;color:var(--text-secondary);}
.preview-remove{background:none;border:none;color:var(--text-secondary);cursor:pointer;font-size:1rem;padding:4px;border-radius:6px;transition:color .2s;}
.preview-remove:hover{color:var(--accent-red);}

.input-row{
    display:flex;align-items:center;gap:10px;
    background:var(--bg-card);border:1.5px solid var(--border-color);
    border-radius:14px;padding:8px 10px;
    box-shadow:var(--shadow-sm);transition:border-color .2s;
}
.input-row:focus-within{border-color:var(--accent-blue);}
.attach-btn{
    width:36px;height:36px;border-radius:9px;border:none;background:transparent;
    color:var(--text-secondary);cursor:pointer;font-size:1.05rem;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    transition:all .2s;
}
.attach-btn:hover{background:rgba(65,105,225,.08);color:var(--accent-blue);}
.msg-input{
    flex:1;background:transparent;border:none;outline:none;
    font-size:0.9rem;color:var(--text-primary);padding:4px 6px;
    resize:none;font-family:inherit;line-height:1.4;
}
.msg-input::placeholder{color:var(--text-secondary);}
.send-btn{
    width:38px;height:38px;border-radius:10px;border:none;
    background:var(--accent-gradient);color:#fff;cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-size:0.95rem;
    flex-shrink:0;box-shadow:0 2px 8px rgba(65,105,225,.3);
    transition:all .15s;
}
.send-btn:hover{opacity:.9;transform:translateY(-1px);}
.send-btn:active{transform:scale(.95);}
.send-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}

/* upload progress bar */
.upload-progress{
    height:3px;background:var(--border-color);border-radius:2px;margin-top:8px;overflow:hidden;display:none;
}
.upload-progress.active{display:block;}
.upload-progress-bar{height:100%;background:var(--accent-gradient);border-radius:2px;width:0%;transition:width .3s;}

/* ── MODAL ── */
.modal-overlay{
    position:fixed;inset:0;background:rgba(15,23,42,.55);
    backdrop-filter:blur(5px);display:none;
    align-items:center;justify-content:center;z-index:1000;padding:16px;
}
.modal-overlay.active{display:flex;}
.modal-card{
    background:var(--bg-card);border-radius:var(--radius-lg);
    width:100%;max-width:440px;padding:24px;
    display:flex;flex-direction:column;gap:16px;
    box-shadow:0 24px 48px rgba(0,0,0,.14);
    animation:pop .2s cubic-bezier(.16,1,.3,1);
}
@keyframes pop{from{transform:scale(.95);opacity:0;}to{transform:scale(1);opacity:1;}}
.modal-header{display:flex;justify-content:space-between;align-items:center;}
.modal-header h3{font-size:1.05rem;font-weight:800;}
.modal-close{background:none;border:none;font-size:1.4rem;cursor:pointer;color:var(--text-secondary);line-height:1;}
.modal-body{font-size:0.875rem;color:var(--text-secondary);line-height:1.6;}
.modal-footer{display:flex;justify-content:flex-end;gap:10px;}

/* ── MOBILE OVERLAY ── */
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:15;}

/* ── TOAST ── */
.toast{
    position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);
    background:#16213e;color:#fff;padding:10px 20px;border-radius:999px;
    font-size:0.82rem;font-weight:600;opacity:0;transition:all .3s;z-index:2000;
    white-space:nowrap;pointer-events:none;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ── RESPONSIVE ── */
@media(max-width:860px){
    html,body{overflow:hidden;}
    .sidebar{
        position:fixed;top:0;left:0;height:100%;z-index:20;
        transform:translateX(-100%);
    }
    .sidebar.open{transform:translateX(0);}
    .sidebar-overlay.open{display:block;}
    .hamburger{display:flex;}
    .chat-messages{padding:16px;}
    .input-bar{padding:10px 14px;}
    .bubble-wrap{max-width:82%;}
    .chat-topbar{padding:0 14px;}
    .chat-img{max-width:200px;max-height:180px;}
}

@media(max-width:480px){
    .bubble-wrap{max-width:88%;}
    .chat-img{max-width:170px;}
}
</style>
</head>
<body>

<div class="workspace" id="workspace">

    <!-- ── SIDEBAR ── -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <a href="#" class="back-btn" id="backLink"><i class="fa-solid fa-arrow-left"></i></a>
            <span class="contract-title-text" id="contractTitle">Loading…</span>
        </div>
        <div class="sidebar-inner">

            <div class="panel">
                <div class="panel-label"><i class="fa-solid fa-shield-halved"></i> Contract Status</div>
                <p class="status-line" id="contractStatusLine">—</p>
                <div class="actions-row" id="contractActionsRow"></div>
            </div>

            <div class="panel">
                <div class="panel-label"><i class="fa-solid fa-flag-checkered"></i> Milestones</div>
                <div id="milestonesList" style="display:flex;flex-direction:column;gap:8px;"></div>
            </div>

        </div>
    </aside>

    <!-- mobile overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- ── CHAT AREA ── -->
    <main class="chat-area">

        <div class="chat-topbar">
            <div class="chat-peer">
                <button class="hamburger" id="hamburger" aria-label="Contract details">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <div class="peer-avatar" id="peerAvatar"></div>
                <div>
                    <div class="peer-name" id="peerName">Secure Workspace</div>
                    <div class="peer-status">Active Escrow</div>
                </div>
            </div>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="empty-chat">
                <i class="fa-solid fa-comment-dots"></i>
                <p>Loading messages…</p>
            </div>
        </div>

        <div class="input-bar" id="inputBar">
            <!-- upload preview strip -->
            <div class="upload-preview" id="uploadPreview">
                <div class="preview-file-icon" id="previewIcon"><i class="fa-solid fa-file"></i></div>
                <img class="preview-thumb" id="previewThumb" src="" alt="" style="display:none;">
                <div class="preview-info">
                    <div class="preview-name" id="previewName">—</div>
                    <div class="preview-size" id="previewSize">—</div>
                </div>
                <button class="preview-remove" id="previewRemove" title="Remove"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="upload-progress" id="uploadProgress">
                <div class="upload-progress-bar" id="uploadProgressBar"></div>
            </div>
            <div class="input-row">
                <button class="attach-btn" id="attachBtn" title="Attach file">
                    <i class="fa-solid fa-paperclip"></i>
                </button>
                <input type="file" id="fileInput" accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.txt" style="display:none;">
                <input type="text" class="msg-input" id="msgInput" placeholder="Type a message…" autocomplete="off" maxlength="2000">
                <button class="send-btn" id="sendBtn" disabled><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>

    </main>

</div>

<!-- ── MODAL ── -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal-card">
        <div class="modal-header">
            <h3 id="modalTitle">Notice</h3>
            <button class="modal-close" id="modalClose">&times;</button>
        </div>
        <div class="modal-body" id="modalBody"></div>
        <div class="modal-footer">
            <button class="mini-btn outline" id="modalCancel" style="display:none;">Cancel</button>
            <button class="mini-btn" id="modalAction">Okay</button>
        </div>
    </div>
</div>

<!-- ── TOAST ── -->
<div class="toast" id="toast"></div>

<script type="module" src="js/firebase.js"></script>
<script type="module" src="js/site-status.js"></script>
<script type="module" src="js/silver-surfer.js"></script>
<script type="module" src="js/contract-detail.js"></script>
<script src="js/pwa.js"></script>
</body>
</html>
